name: playeroff_cast
description: >-
  Send a video to a TV running PlayerOFF and control it from a Flutter app:
  connect with the code or QR on the screen, cast HLS/DASH/MP4, drive playback
  and follow it live. Pure-Dart core over the open PlayerOFF API.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  meta: ^1.16.0

dev_dependencies:
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/playeroff.png
